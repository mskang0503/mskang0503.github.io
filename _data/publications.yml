# Master list of publications.
#
# Rendered in two places:
#   - _pages/publications.md : every entry, grouped by `type`
#   - index.md               : entries with `selected: true`
#
# Fields
#   key      : citation label shown in brackets, e.g. CKL26
#   link     : URL for the label. Omit for papers with no public link yet.
#   title    : plain title, quotes are added by the template
#   authors  : author list as displayed (escape asterisks as \*, use † for corresponding)
#   venue    : bolded venue line. Omit for preprints.
#   note     : appended after the venue, e.g. "to appear"
#   type     : conference | journal | preprint  (controls the section on /publications/)
#   selected : true to also show it on the front page
#
# Order within this file is the order shown on the site.

